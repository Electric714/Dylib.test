name: Build dylib

on:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Build dylib
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: build/FloatingBubble.dylib
